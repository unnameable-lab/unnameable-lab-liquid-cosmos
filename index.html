<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 res;uniform float time,reliefAmt,ridgeAmt,reflectAmt,specAmt,lensAmt;uniform float scene[5];uniform float sceneP[6];uniform float cellAmt;  // 青,黄金,ミトコンドリア,モルフォ,スチームパンク の重み
uniform sampler2D hTex;uniform sampler2D fluidTex;uniform float fluidAmt;uniform float heightPass,depthAmt,boilAmt,flowK,glowAmt,monoAmt,pastelAmt,liquidAmt;
uniform vec3 cores[4];uniform vec2 vels[4];uniform float spins[4];uniform vec2 lagCores[4];uniform float wrapW;uniform float tidePh[4];uniform float tideA[4];uniform float tideLvl;uniform float tideT,tideAmt,pulse,peri,nonlin,rdAmt,lite;uniform vec2 jitter;uniform sampler2D rdTex;
float hash21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float tanh_(float x){x=clamp(x,-10.,10.);float e=exp(2.*x);return (e-1.)/(e+1.);}
vec2 tanh2(vec2 v){return vec2(tanh_(v.x),tanh_(v.y));}
// 結晶の面：ボロノイのセルごとに一定の勾配（区分的平面）。面の境目で法線が折れる
float facets(vec2 p){
 vec2 q=p*1.6;vec2 c=floor(q);float best=1e9;vec2 bc=vec2(0.);
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 id=c+vec2(float(x),float(y));vec2 pt=id+vec2(hash21(id),hash21(id+5.));float d=length(q-pt);if(d<best){best=d;bc=pt;}}
 vec2 g=(vec2(hash21(bc+11.),hash21(bc+17.))-.5)*.9;
 return dot(q-bc,g);
}
float noise2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int k=0;k<4;k++){s+=a*noise2(p);p=mat2(.8,-.6,.6,.8)*p*2.03+3.7;a*=.5;}return s;}
// 稜線ノイズ：谷ではなく尾根が鋭くなる。光が走る線はここから出る
float ridged(vec2 p){float s=0.,a=.5;for(int k=0;k<4;k++){float n=1.-abs(2.*noise2(p)-1.);s+=a*n*n;p=mat2(.8,-.6,.6,.8)*p*2.2+1.3;a*=.55;}return s;}
// 高さ場：広いうねり ＋ 細かい稜線 ＋ 渦（椀状に沈み、縁がわずかに盛り上がる）
// 分潮：振幅比 M2:S2:K1:O1 ≈ 1:.46:.58:.41、周期は時間単位「1日」で 12.42h/12.00h/23.93h/25.82h。波数ベクトルは各分潮で向きを変える
float tide(vec2 p,float T){
 const float TAU=6.2831853;
 float d=T;                                   // T は「日」
 const float EPS=.22;                          // Stokes 2次項の比。峰が尖り、谷が平らになる
 // 位相と振幅はJSから（架空の潮、または東京の調和定数から計算した実際の潮）
 float t1=tidePh[0]+dot(p,vec2(.55,.30));
 float t2=tidePh[1]+dot(p,vec2(-.40,.45));
 float t3=tidePh[2]+dot(p,vec2(.20,-.60));
 float t4=tidePh[3]+dot(p,vec2(-.62,-.18));
 float m2=cos(t1)+EPS*cos(2.*t1), s2=cos(t2)+EPS*cos(2.*t2), k1=cos(t3)+EPS*cos(2.*t3), o1=cos(t4)+EPS*cos(2.*t4);
 return (tideA[0]*m2+tideA[1]*s2+tideA[2]*k1+tideA[3]*o1)/(2.45*(1.+EPS));
}
// 瑪瑙の縞：渦のまわりの距離を幅の違う硬い帯に量子化。x=段差の高さ、y=帯ごとの色の明暗
// 左右の周期境界：渦との差は、いちばん近い写し（左右に幅ぶんずらした渦）で測る
vec2 wd(vec2 d){if(wrapW>0.)d.x-=wrapW*floor(d.x/wrapW+.5);return d;}
vec2 agate(vec2 p){
 float step_=0.,tint=0.,wsum=0.;
 for(int i=0;i<4;i++){
  vec2 d=wd(p-cores[i].xy);float L=length(d)/cores[i].z;
  float ang=atan(d.y,d.x);
  float u=L*4.5+.35*sin(ang*3.+float(i))+.5*fbm(p*1.2+float(i)*3.);   // 帯の位相（少し歪ませる）
  float b=floor(u),f=fract(u);
  float width=.4+.5*hash21(vec2(b,float(i)));                           // 帯の幅はばらつく
  float edge=smoothstep(.0,.06,f)*(1.-smoothstep(width,width+.06,f));   // 硬い縁
  float w=exp(-pow(max(L-1.1,0.)/.9,2.))*smoothstep(1.0,1.2,L);
  step_+=w*(hash21(vec2(b+7.,float(i)))-.5)*.5*edge;
  tint+=w*(hash21(vec2(b+3.,float(i)))-.5)*edge;wsum+=w;
 }
 return vec2(step_,tint);
}
// 風波：ω²=g·k の分散関係を持つ12成分。長い波ほど速い。振幅はk⁻²（Phillips型）。主方向±35°に散らす
uniform float waveAmt;
float windWaves(vec2 p,float t){
 // 渦の椀＝浅い場所：波数を局所的に増やす（波長が縮み、渦のまわりで波が曲がる）
 vec2 pw=p;
 vec2 U=vec2(0.);                                            // 渦が誘導する流れ（正則化した点渦）
 for(int i=0;i<4;i++){vec2 d=wd(p-cores[i].xy);float L=length(d)/cores[i].z;float w=exp(-L*L*.3);pw+=d*w*.35;
  float handed=(mod(float(i),2.)<.5)?1.:-1.;float G=handed*cores[i].z*cores[i].z*11.0;
  for(int m=-1;m<=1;m++){if(m!=0&&wrapW<=0.)continue;vec2 dm=p-cores[i].xy-vec2(float(m)*wrapW,0.);   // 周期のときは左右の写しも足す（継ぎ目が出ない）
   U+=G/6.2831853*vec2(-dm.y,dm.x)/(dot(dm,dm)+cores[i].z*cores[i].z*.8);}}
 U=tanh2(U*1.5)/1.5;                                          // 有界化
 float sum=0.,norm=0.;const float g=2.0;
 for(int j=0;j<12;j++){
  if(lite>.5&&j>=6)break;
  float fj=float(j);
  float k=1.0+4.0*pow(hash21(vec2(fj,1.)),1.5);                 // 波数 1〜5
  float th=.9+(hash21(vec2(fj,2.))-.5)*1.22;                     // 方向：主方向±35°
  float om=sqrt(g*k);                                            // 深水の分散関係
  float a=1./(k*k);                                              // Phillips型の振幅
  float ph=hash21(vec2(fj,3.))*6.2831853;
  vec2 kv=k*vec2(cos(th),sin(th));
  float omD=om+nonlin*dot(kv,U)*.9;                              // ドップラー：流れに乗る波は速く、逆らう波は遅い（＝前面で詰まる）
  float th_=dot(pw,kv)-omD*t+ph;
  sum+=a*(cos(th_)+.18*cos(2.*th_)*k*.35);                       // ここにも軽いStokes非対称
  norm+=a;
 }
 return sum/norm;
}
// 沸騰：奥から泡が湧き、膨らみながら手前にせり上がり、模様を外へ押し広げて、平らに戻る
// 戻り値 xy＝模様の押し出し、z＝高さ（せり上がり）
vec3 boil(vec2 p){
 if(boilAmt<.01)return vec3(0.);
 const float G=1.9;                                              // 泡の間隔：数を減らして大きく
 vec2 cell=floor(p/G);vec3 acc=vec3(0.);
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){

 if(gScene==1)return pick6(s,vec3(.03,.04,.03),vec3(.20,.85,.30),vec3(1.,.78,.25),vec3(.10,.65,.55),vec3(1.,.97,.80),vec3(.95,.45,.10));   // 緑金：暗い地に緑・金・青緑
 if(gScene==2)return pick6(s,vec3(.85,.05,.12),vec3(1.,.25,.55),vec3(.45,.02,.06),vec3(1.,.30,.15),vec3(1.,.85,.90),vec3(.25,.85,.95));   // 紅：深紅・マゼンタに水色の島
 if(gScene==3)return pick6(s,vec3(.03,.05,.12),vec3(.10,.40,1.),vec3(.30,.90,1.),vec3(.55,.80,.85),vec3(1.,1.,1.),vec3(.80,.65,.95));   // 螺鈿：紺の地に青・水色・銀
 if(gScene==4)return pick6(s,vec3(.04,.03,.04),vec3(.55,.12,.05),vec3(.25,.95,.35),vec3(.95,.25,.80),vec3(.25,.85,1.),vec3(1.,.90,.30));   // 虹油：暗い地に油膜の虹
 // 陽光：赤 26%・橙 18%・黄 18%・ターコイズ 20%・白 9%・緑 9%
 return s<.30?vec3(.85,.08,.04):s<.50?vec3(1.,.36,.06):s<.75?vec3(1.,.84,.18):s<.87?vec3(.08,.78,.86):s<.97?vec3(1.08,1.02,.86):vec3(.30,.76,.20);

// 帯ひとつ分の色：帯ごとにパレットから色を選び、中に細い等値線、境目に暗い輪郭と明るい線
// ボロノイ：x=中心までの距離, y=2番目の距離, zw=中心座標
vec4 voro(vec2 x){
 vec2 n=floor(x),f=fract(x);float d1=8.,d2=8.;vec2 cc=vec2(0.);
 for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(float(i),float(j));vec2 o=vec2(hash21(n+g),hash21(n+g+17.3))*.85+.075;vec2 r=g+o-f;float d=dot(r,r);
  if(d<d1){d2=d1;d1=d;cc=n+g+o;}else if(d<d2){d2=d;}}
 return vec4(sqrt(d1),sqrt(d2),cc);
}
// 陽光の帯の並び：赤・橙・赤・黄・ターコイズ・赤・橙・ターコイズ・白・緑 の順に巡る（どこを切り取っても配分が崩れない）
vec3 sunSeq(float b){
 float k=mod(b+floor(hash21(vec2(floor(b/10.),3.))*10.),10.);   // 10本ごとに開始位置をずらし、縞の規則性を崩す
 // 赤4・橙2・シアン2・黄1・クリーム1（参考の色相の割合に合わせた並び）
 return k<1.?vec3(.82,.06,.04):k<2.?vec3(1.,.34,.06):k<3.?vec3(.90,.12,.05):k<4.?vec3(.10,.72,.86):k<5.?vec3(1.,.82,.20):
        k<6.?vec3(.85,.08,.05):k<7.?vec3(1.,.45,.08):k<8.?vec3(.12,.60,.85):k<9.?vec3(.92,.16,.06):vec3(1.10,1.02,.84);
}
float shardH(vec2 p){
 if(cellAmt<.01||lite>.5||depthAmt<.01)return 0.;
 vec2 q0=warpQ(p);
 float K=mix(9.,6.5,sceneP[5]);
 vec2 wq=q0*K+.55*vec2(fbm(q0*K*.3),fbm(q0*K*.3+5.2))-.27;
 vec4 vc=voro(wq);
 vec2 cellO=wq-vc.zw;
 vec2 tilt=(vec2(hash21(vc.zw+3.1),hash21(vc.zw+7.7))-.5)*.9;
 float eyeK=1.;for(int i=0;i<4;i++){float Le=length(wd(p-cores[i].xy))/cores[i].z;eyeK*=smoothstep(1.2,2.6,Le);}
 float amp=(1.-liquidAmt)*cellAmt*mix(.45,1.,sceneP[5])*(.1+.9*eyeK)*min(depthAmt,1.5);
 if(sceneP[5]>.01){float fB=(fbm(q0*.34)+.5*fbm(q0*1.+vec2(3.,7.)))*8.;float eB=min(fract(fB),1.-fract(fB));
  amp*=mix(1.,mix(.2,1.,smoothstep(.20,.04,eB)),sceneP[5]);}   // 破片の凹凸も境目付近だけ
 float groove=smoothstep(.0,.14,vc.y-vc.x);                       // 継ぎ目は溝：崖にすると反射で白い網目が出る
 return amp*((.42*hash21(vc.zw+5.5)+.30*dot(cellO,tilt))*groove-.12*(1.-groove));          // 破片ごとに傾いた板：高さがばらつく
}
vec3 bandCol(float u,float salt){
 float b=floor(u),fr=fract(u);
 vec3 c=gScene==5?sunSeq(b+salt)*(.62+.6*hash21(vec2(b,salt+3.))):palette(hash21(vec2(b+salt,7.)));   // 陽光：帯ごとの明暗差を大きく
 if(gScene==3||gScene==4){vec3 rb=.5+.5*cos(6.2831853*(u*.17+fr*.35+salt*.03+vec3(0.,.33,.67)));c=mix(c,rb*(.30+.8*max(c.r,max(c.g,c.b))),gScene==4?.55:.35);}   // 薄膜の虹：帯の中で色が移ろう
 if(gScene==1||gScene==3||gScene==4)c*=.04+1.1*smoothstep(.15,.6,hash21(vec2(b,salt+11.)));   // 暗い地：帯の3割ほどは闇に沈める
 else if(gScene!=5)c*=.45+.7*hash21(vec2(b,salt+11.));                                     // 帯ごとの明暗差
 float hatch=.5+.5*cos(fr*6.2831853*2.);
 c*=.76+.24*hatch;
 float dark=gScene==5?smoothstep(.11,.0,fr)+smoothstep(.92,1.,fr):smoothstep(.08,.0,fr)+smoothstep(.94,1.,fr);
 float lite=smoothstep(.05,.09,fr)*(1.-smoothstep(.09,.13,fr));
 c=mix(c,vec3(.01,.01,.04),dark*.92);
 c+=vec3(.9,.92,1.)*lite*.22*(1.-.9*liquidAmt);   // 液体では帯の縁の白線を消す（液面の照りに任せる）
 return c;
}
vec3 pigment(vec2 p,vec2 q){
 // 1) 色面：粗い区画で色の種類を決め、区画の中は控えめな帯。大きな色の塊が残る
 float f=fbm(q*.34)+.5*fbm(q*1.+vec2(3.,7.));
 float z=fbm(q*.3+vec2(11.,5.))*6.;float zb=floor(z),zfr=fract(z);
 float uB=f*(gScene==5?8.:9.);   // どのシーンも塊を大きくgEdge=min(fract(uB),1.-fract(uB));   // 色の塊の境目までの近さ（0＝境目）
 vec3 c=bandCol(uB,0.);
 if(gScene==1||gScene==3||gScene==4){float dk=fbm(q*.55+vec2(7.,3.))+.25*fbm(q*1.7+vec2(2.,9.));c*=mix(.04,1.,smoothstep(.50,.62,dk));c=mix(c,vec3(.01,.01,.03),smoothstep(.016,.0,abs(dk-.50))*.9);}   // 暗い地：大きな闇の淵（螺鈿・虹油・緑金）                         // 陽光は塊を大きく                                        // 区画で帯を切らない（直線の切れ目が汚れに見えるため）
 // 島：色面の中に浮かぶ、輪郭つきの小さな色の粒
 float isl=fbm(q*2.3+vec2(5.,2.));
 float im=smoothstep(.615,.635,isl);
 vec3 ic=palette(hash21(vec2(floor(isl*9.)+zb*5.,31.)))*(.75+.25*cos(isl*6.2831853*14.));
 float dA=detailAmt*(gScene==5?.3:.45);                              // 陽光は細かい描き込みを控えめに
 c=mix(c,ic,im*dA);
 c=mix(c,vec3(.01,.01,.04),smoothstep(.012,.0,abs(isl-.625))*.85*dA);
 // 等高線：色面を走る細い線（地形図の等高線のように場の等値線を引く）
 float cl=.5+.5*cos(f*6.2831853*48.);
 c*=1.-.14*dA*smoothstep(.8,1.,cl);
 // 目の外縁を「つながる泡」として扱う：各目の外縁までの距離 eD を、なめらかに最小をとって一つの輪郭にする
 float eD[4];float uD=9.,nR=.3,nE=2.2,nSalt=3.;float eMin=9.;
 for(int i=0;i<4;i++){vec2 d=wd(p-cores[i].xy);float Ri=max(cores[i].z,1e-3);float th=atan(d.y,d.x);
  float edg=(gScene==5?2.05:2.25)+(gScene==5?.35:.6)*(fbm(vec2(cos(th),sin(th))*1.3+float(i)*3.+spins[i]*.05)-.5)*2.;
  eD[i]=(length(d)/Ri-edg)*Ri;
  float k=.55*Ri;float hh=clamp(.5+.5*(uD-eD[i])/k,0.,1.);uD=mix(uD,eD[i],hh)-k*hh*(1.-hh);
  if(eD[i]<eMin){eMin=eD[i];nR=Ri;nE=edg;nSalt=float(i)*29.+3.;}}
 // 2) 目玉：渦のまわりを同心円の帯で置き換える。輪は歪み、渦と一緒に回る。外縁は輪郭で切る
 for(int i=0;i<4;i++){
  vec2 d=wd(p-cores[i].xy);float R=cores[i].z;float L=length(d)/R;
  if(L<3.2){
   float th=atan(d.y,d.x);
   float hd=(mod(float(i),2.)<.5)?1.:-1.;
   float swirlA=.45+1.5*(1.-smoothstep(.6,1.9,L));                     // 内側ほど強く巻く
   float ue=(gScene==5?8.:5.6)*pow(L,.8)+swirlA*sin(2.*th-hd*5.*L+spins[i]*.6+float(i))+.25*sin(5.*th-spins[i]*.3)+1.6*(fbm(q*1.6+float(i)*5.)-.5);
   vec3 ce=bandCol(ue,float(i)*29.+3.);
   vec3 ceSoft=palette(hash21(vec2(floor(ue)+float(i)*29.+3.,7.)))*(.75+.25*cos(fract(ue)*6.2831853*2.));
   ce=mix(ce,ceSoft,.55*(1.-smoothstep(.8,1.8,L)));                     // 内側ほど輪郭が溶ける
   ce*=1.-.2*detailAmt*smoothstep(.8,1.,.5+.5*cos(ue*6.2831853*6.));
   // 外側の輪：溝ごとに虹色がちらつく（薄膜干渉）
   float inner=gScene==5?0.:1.-smoothstep(1.0,1.75,L);   // 陽光：暗い内側はなく、輪が穴のすぐ際まで来る
   ce+=(.5+.5*cos(6.2831853*(ue*3.+vec3(0.,.33,.67))))*.14*(1.-inner)*detailAmt;
   // 内側：暗い紺紫の中に、明るい破片が渦を巻いて吸い込まれていく
   float phi=hd*(2.4/(L+.3))+spins[i]*.8;                               // 中心ほど速く回る
   vec2 sp=mat2(cos(phi),-sin(phi),sin(phi),cos(phi))*(d/R);
   vec3 inA=gScene==0?vec3(.12,.06,.30):gScene==1?vec3(.02,.05,.03):gScene==2?vec3(.25,.02,.06):gScene==3?vec3(.02,.04,.15):gScene==4?vec3(.03,.03,.05):vec3(.30,.05,.03);
   vec3 inB=gScene==0?vec3(.40,.20,.65):gScene==1?vec3(.20,.45,.15):gScene==2?vec3(.60,.08,.25):gScene==3?vec3(.15,.35,.60):gScene==4?vec3(.30,.20,.35):vec3(.70,.22,.06);
   vec3 darkIn=mix(inA,inB,noise2(sp*3.+float(i)*7.));                  // シーンの色で暗く沈む
   float chipN=noise2(sp*6.+float(i)*13.);
   vec3 chip=palette(hash21(floor(sp*6.)+float(i)*3.))*1.2;
   vec3 innerCol=mix(darkIn,chip,smoothstep(.6,.68,chipN)*(.4+.6*detailAmt));
   innerCol=mix(innerCol,vec3(.01,.01,.04),smoothstep(.015,.0,abs(chipN-.6))*.8);   // 破片の輪郭
   ce=mix(ce,innerCol,inner);
   ce*=gScene==5?1.08:mix(.38,1.,smoothstep(.6,1.7,L));   // 円盤に向かって沈む（陽光は明るい輪のまま）
   if(gScene==5){
    // 白い細い渦巻きの筋：輪に沿ってらせん状に走り、穴の際と外縁で強い
    float spiral=L*15.-hd*th*2.+spins[i]*1.2+2.*fbm(q*2.+float(i));
    float wl=smoothstep(.72,.96,.5+.5*cos(spiral));
    float wAmt=.75+.7*(exp(-pow((L-.78)/.10,2.))+exp(-pow((L-1.6)/.25,2.)));
    ce=mix(ce,vec3(1.12,1.08,1.),wl*wAmt*.85*(1.-.45*liquidAmt));   // 液体では照りに役目を渡して控えめに
    ce=mix(ce,vec3(1.15,1.12,1.05),exp(-pow((L-.72)/.04,2.))*.95);   // 穴の際の白い縁
    ce=mix(ce,vec3(.08,.78,.88),smoothstep(.75,.95,.5+.5*cos(L*9.-hd*th+spins[i]))*.45*exp(-pow((L-1.3)/.35,2.)));   // 輪の間に差すターコイズ
   }
   float edge=(gScene==5?2.05:2.25)+(gScene==5?.35:.6)*(fbm(vec2(cos(th),sin(th))*1.3+float(i)*3.+spins[i]*.05)-.5)*2.;   // 外縁の位置（不規則。角度の継ぎ目が出ないよう円周上で評価）
   float inside=smoothstep(edge+.03,edge-.03,L);
   float mo=9.;for(int j=0;j<4;j++){if(j!=i)mo=min(mo,eD[j]);}
   inside*=smoothstep(.015,-.015,eD[i]-mo);                         // 重なった所は、より深く入っている泡の側に属する（膜で二つに分かれる）
   c=mix(c,ce,inside);
  }
 }
 // 首：二つの泡の間を埋める部分。外側の輪の色が首を伝ってつながる
 if(uD<.0&&eMin>0.){float Le=max(nE+uD/nR,.5);float ue=(gScene==5?8.:5.6)*pow(Le,.8);c=mix(c,bandCol(ue,nSalt),smoothstep(.0,-.03*nR,uD));}
 c=mix(c,vec3(.01,.01,.04),smoothstep(.07*nR,.0,abs(uD))*.9);            // 泡全体の輪郭（つながった一本の線）
 for(int i=0;i<4;i++)for(int j=0;j<4;j++){if(j<=i)continue;
  float Rm=.5*(cores[i].z+cores[j].z);if(Rm<.02)continue;
  float a=eD[i],b=eD[j];
  // 重なった所の膜：二つの泡が等しく押し合う線
  c=mix(c,vec3(.02,.02,.04),smoothstep(.022,.006,abs(a-b))*smoothstep(.0,-.03,max(a,b))*.9);
  c+=vec3(.9,.95,1.)*exp(-pow((a-b)/.05,2.))*smoothstep(.0,-.03,max(a,b))*.18;   // 膜の照り
  // 首の付け根：曲がりが一番きつい所が光る
  float g=exp(-pow((a-b)/(.16*Rm),2.))*exp(-pow(uD/(.09*Rm),2.))*smoothstep(-.25*Rm,.0,min(a,b))*smoothstep(.8*Rm,.1*Rm,min(a,b));
  c=mix(c,vec3(1.,.42,.08),g*.9);c+=vec3(1.,.75,.3)*g*.6;}
 c*=.92+.16*fbm(q*3.+vec2(1.,9.));                                  // 色面の中のむら（彫りの濃淡）
 return c;
}
// ---- 輝点：白い光点。渦で巻かれた座標に乗るので流れと一緒に巻き込まれる。渦の縁に多い ----
vec3 sparkles(vec2 p,vec2 q){
 float near=0.;for(int i=0;i<4;i++){float L=length(wd(p-cores[i].xy))/cores[i].z;near+=exp(-pow((L-1.6)/.7,2.));}
 vec2 cell=floor(q*4.);vec3 light=vec3(0.);
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
  vec2 id=cell+vec2(float(x),float(y));float h=hash21(id);
  vec2 ctr=(id+vec2(hash21(id+7.),hash21(id+19.)))/4.;
  float d=length(q-ctr);
  float blink=.35+.65*pow(.5+.5*sin(sparkT*(1.2+h*2.5)+h*31.),2.);
  float on=step(.58-.3*clamp(near,0.,1.),h);
  float sz=.6+.8*hash21(id+3.);
  light+=vec3(.88,.96,1.)*(exp(-d*d/(.0007*sz))*2.2+exp(-d*d/(.006*sz))*.35)*blink*on;
 }
 return light;
}
// ---- 3次元の処理：高さの地図（hTex）を使う ----
float hAt(vec2 p){vec2 fc=p/3.5*min(res.x,res.y)+.5*res-jitter;vec4 t=texture2D(hTex,clamp(fc/res,0.,1.));return (t.r+t.g/255.)*12.-5.;}
float hSm(vec2 p){vec2 fc=p/3.5*min(res.x,res.y)+.5*res-jitter;vec4 t=texture2D(hTex,clamp(fc/res,0.,1.));return (t.b+t.a/255.)*12.-5.;}   // 視差用：破片の段差を含まない
const float HTOP=2.6,HBOT=-2.2;                                  // 高さの範囲（視差の計算に使う）
float zScale(){return .055*depthAmt;}                            // 高さ1あたりの奥行き（画面上の距離）
// 視差：斜めの視線が凹凸に当たる場所を探す（高い所から段々に下りていく）
vec2 pomP(vec2 p,vec3 v){
 vec2 dir=-v.xy/max(v.z,.35)*zScale();
 float n=lite>.5?6.:12.;
 vec2 prevQ=p;float prevS=-1.;
 for(int k=0;k<=12;k++){
  if(float(k)>n)break;
  float depth=float(k)/n*(HTOP-HBOT);                            // 視線の、頂上からの深さ
  vec2 q=p+dir*depth;float surf=HTOP-hSm(q);                      // 表面の、頂上からの深さ
  float sd=surf-depth;
  if(sd<=0.){float t=prevS/(prevS-sd+1e-4);return mix(prevQ,q,clamp(t,0.,1.));}
  prevQ=q;prevS=sd;
 }
 return prevQ;
}
// 影：光の方向へ光線を伸ばし、凹凸に遮られるか調べる（柔らかい影）
float shadowAt(vec2 p,float h,vec3 L){
 float s=1.;float steps=lite>.5?6.:14.;
 vec2 dir=L.xy/max(L.z,.25)*.20*depthAmt;                       // 影用の縦の縮尺（法線とおおむね揃える）
 for(int k=1;k<=14;k++){
  if(float(k)>steps)break;
  float dh=float(k)*float(k)*.012+.02;                           // 光線が上った高さ（近くは細かく、遠くは粗く）
  float hq=hAt(p+dir*dh);
  s=min(s,clamp(1.-(hq-(h+dh))*6./max(dh*4.,.25),0.,1.));
 }
 return s;
}
// くぼみの暗さ：まわりより低い所ほど暗い
float aoAt(vec2 p,float h){
 float a=0.;float r1=.03,r2=.09;
 for(int k=0;k<6;k++){float an=float(k)*1.0472;vec2 o=vec2(cos(an),sin(an));
  a+=max(0.,hAt(p+o*r1)-h)*.6+max(0.,hAt(p+o*r2)-h)*.4;}
 return clamp(1.-a/6.*2.2*depthAmt,.3,1.);
}
void main(){
 vec2 uv=(gl_FragCoord.xy+jitter-.5*res)/min(res.x,res.y);vec2 p=uv*3.5;
 // 1パス目：高さだけを計算して画像に書き出す（16bitに分けて2チャンネルへ）
 if(heightPass>.5){float hs=H(p);float hh=hs+shardH(p);float hv=clamp((hh+5.)/12.,0.,1.);float sv=clamp((hs+5.)/12.,0.,1.);
  gl_FragColor=vec4(floor(hv*255.)/255.,fract(hv*255.),floor(sv*255.)/255.,fract(sv*255.));return;}   // RG=破片込みの高さ、BA=なめらかな高さ
 // 2パス目：高さの地図を読んで、3次元として光を計算する
 vec2 sway=.22*depthAmt*vec2(sin(time*.05+.7),cos(time*.037));    // カメラがゆっくり揺れる（視差で奥行きが見える）
 vec3 v=normalize(vec3(-uv*.15-sway,1.));
 if(depthAmt>.01)p=pomP(p,v);
 float e=3.5/min(res.x,res.y);
 float h0=hAt(p);
 vec3 n=normalize(vec3((h0-hAt(p+vec2(e,0)))/e,(h0-hAt(p+vec2(0,e)))/e,.9));
 if(liquidAmt>.01){float E=e*4.;vec3 nc=normalize(vec3((hAt(p-vec2(E,0))-hAt(p+vec2(E,0)))/(2.*E),(hAt(p-vec2(0,E))-hAt(p+vec2(0,E)))/(2.*E),.9));n=normalize(mix(n,nc,.85*liquidAmt));}   // 液面：細かい折り目を均して、つるっとした面の法線に
 float cosv=clamp(dot(n,v),0.,1.);
 // 導体のFresnel（Schlick）：F0に色を持つ。金属は反射とハイライトに色が付き、誘電体は白いまま
 vec3 F0=vec3(.35,.55,.75)*scene[0]+vec3(1.,.76,.33)*scene[1]+vec3(.04)*scene[2]+vec3(.05,.05,.09)*scene[3]+vec3(.60,.60,.66)*scene[4];
 float metal=.45*scene[0]+1.*scene[1]+0.*scene[2]+.2*scene[3]+.4*scene[4];
 vec3 Fc=F0+(1.-F0)*pow(1.-cosv,5.);
 float fresnel=.06+.94*pow(1.-cosv,4.);
 // 液体金属：反射が主、下地の薄膜が従
 vec3 r=reflect(-v,n);
 vec3 refl=env(r);
 vec3 base=film(h0,cosv);
 // 稜線の谷を暗く（線が見える）、尾根を明るく
 base*=.95;
 float gloss=1.-.55*scene[2]-.3*scene[3]+.35*scene[4];
 // 瑪瑙の帯ごとの明暗
 float mineral=1.-.7*scene[2]-.5*scene[3];
